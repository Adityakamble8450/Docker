services:
backend:
  build: ./Backend
  ports:
    - "3000:3000"
  volumes:
    - ./Backend:/app
    - Backend_node_modules:/app/node_modules

command: npx nodemon -L server.js
frontend:
  build: ./frontend
  ports:
    - "5173:5173"
  volumes:
    - ./frontend:/app
    - frontend_node_modules:/app/node_modules
  command: npm run dev 